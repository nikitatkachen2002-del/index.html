<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATRIX PINTEREST EXTRACTOR</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"Share Tech Mono"', 'monospace'] },
                    colors: {
                        matrix: {
                            black: '#000000', dark: '#051005', green: '#00FF41',
                            light: '#b8ffd0', glow: 'rgba(0, 255, 65, 0.5)'
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(0, 255, 65, 0.5), inset 0 0 10px rgba(0, 255, 65, 0.2)',
                        'neon-strong': '0 0 20px rgba(0, 255, 65, 0.8), inset 0 0 15px rgba(0, 255, 65, 0.4)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #000; color: #00FF41; font-family: 'Share Tech Mono', monospace; overflow-x: hidden; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .terminal-scroll::-webkit-scrollbar { width: 8px; }
        .terminal-scroll::-webkit-scrollbar-track { background: rgba(0, 20, 0, 0.8); border-left: 1px solid #00FF41; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.3); }
        .terminal-scroll::-webkit-scrollbar-thumb:hover { background: #00FF41; }
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px black inset !important;
            -webkit-text-fill-color: #00FF41 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        .glitch-anim { animation: textGlitch 2s infinite; }
        @keyframes textGlitch {
            0%, 95%, 100% { opacity: 1; transform: translate(0, 0); }
            96% { opacity: 0.8; transform: translate(-2px, 1px); }
            97% { opacity: 0.9; transform: translate(2px, -1px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <canvas id="matrix-canvas"></canvas>

    <main class="w-full max-w-4xl bg-matrix-black/80 backdrop-blur-sm border border-matrix-green shadow-neon p-6 flex flex-col gap-6 relative z-10">
        <header class="border-b border-matrix-green/50 pb-4 text-center sm:text-left">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-widest glitch-anim drop-shadow-[0_0_5px_rgba(0,255,65,0.8)]">
                MATRIX PINTEREST EXTRACTOR
            </h1>
            <p class="text-matrix-green/70 text-sm mt-2">SYSTEM.PROTOCOL: TG_BOT_DELIVERY</p>
        </header>

        <form id="extractForm" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label for="urlInput" class="text-sm font-bold tracking-widest text-matrix-light">> TARGET_PINTEREST_URL</label>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="url" id="urlInput" required
                        class="block w-full flex-1 px-4 py-3 bg-black border border-matrix-green text-matrix-green focus:outline-none focus:shadow-neon-strong transition-all"
                        placeholder="https://pin.it/..." autocomplete="off">
                    
                    <button type="submit" id="submitBtn" class="bg-black border border-matrix-green text-matrix-green hover:bg-matrix-green hover:text-black font-bold py-3 px-8 transition-all shadow-neon whitespace-nowrap uppercase tracking-widest cursor-pointer">
                        INITIATE_EXTRACTION
                    </button>
                </div>
            </div>
        </form>

        <section class="flex flex-col border border-matrix-green h-64 sm:h-80 bg-black/90 relative">
            <div class="flex items-center justify-between px-4 py-2 border-b border-matrix-green/50 bg-matrix-green/10">
                <h3 class="text-xs font-bold uppercase tracking-widest text-matrix-light">Extraction_Logs</h3>
                <span class="text-xs animate-pulse text-matrix-green">_ONLINE</span>
            </div>
            <div id="terminal" class="flex-1 overflow-y-auto terminal-scroll text-xs sm:text-sm p-4 space-y-1">
                <div class="text-matrix-green/70">> SYSTEM INITIALIZED...</div>
                <div class="text-matrix-green/70">> AWAITING TARGET PARAMETERS...</div>
            </div>
        </section>
    </main>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            } catch (e) { console.log("Браузерный режим"); }
        }

        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns;
        const drops = [];
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');

        function initMatrix() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            const fontSize = window.innerWidth < 600 ? 12 : 16;
            columns = width / fontSize;
            drops.length = 0;
            for (let x = 0; x < columns; x++) drops[x] = Math.random() * -100;
            ctx.font = fontSize + 'px "Share Tech Mono"';
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#0F0';
            const fontSize = window.innerWidth < 600 ? 12 : 16;
            ctx.font = fontSize + 'px "Share Tech Mono"';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        initMatrix();
        window.addEventListener('resize', initMatrix);
        setInterval(drawMatrix, 33);

        const PROXY_URL_HIDDEN = "https://throbbing-fire-14de.nikita-tkachen2002.workers.dev/";
        
        // Вставь сюда ссылку на твой Cloudflare Worker (без слеша на конце)
        const BOT_BACKEND_URL = "https://matrix-bot-server.nikita-tkachen2002.workers.dev"; 

        const form = document.getElementById('extractForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const terminal = document.getElementById('terminal');

        function addLog(message) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const line = document.createElement('div');
            if (message.includes("ERROR") || message.includes("FAILED")) {
                line.className = 'text-red-500 break-words';
                line.innerHTML = `<span class="opacity-50">[${time}]</span> <span class="font-bold">!! ${message}</span>`;
            } else if (message.includes("SUCCESS")) {
                line.className = 'text-white font-bold drop-shadow-[0_0_2px_#fff] break-words';
                line.innerHTML = `<span class="text-matrix-green opacity-50">[${time}]</span> > ${message}`;
            } else {
                line.className = 'text-matrix-green break-words';
                line.innerHTML = `<span class="opacity-50">[${time}]</span> > ${message}`;
            }
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function buildProxyUrl(proxyBase, targetUrl) {
            try {
                let urlObj = new URL(proxyBase);
                urlObj.searchParams.set('url', targetUrl);
                return urlObj.toString();
            } catch (err) {
                let base = proxyBase.trim();
                base += base.includes('?') ? (base.endsWith('&') || base.endsWith('?') ? 'url=' : '&url=') : '/?url=';
                return base + encodeURIComponent(targetUrl);
            }
        }

        // Функция отправки ссылки на бэкенд бота
        async function sendToTelegramBot(mediaUrl, isVideo) {
            try {
                addLog(`SENDING MEDIA TO TELEGRAM BOT SERVER...`);
                
                const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                if (!tgUser || !tgUser.id) {
                    throw new Error("TELEGRAM USER ID NOT DETECTED. OPEN INSIDE TELEGRAM!");
                }

                addLog(`TARGET CHAT ID: ${tgUser.id}`);

                const response = await fetch(BOT_BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: tgUser.id,
                        media_url: mediaUrl,
                        is_video: isVideo
                    })
                });

                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || "Server rejected request");
                }

                addLog(`SUCCESS: FILE SENT TO YOUR TELEGRAM BOT!`);
                
                // Закрываем мини-апп через 2 секунды после успеха
                setTimeout(() => { 
                    if (window.Telegram?.WebApp?.close) {
                        window.Telegram.WebApp.close(); 
                    }
                }, 2000);

            } catch (error) {
                addLog(`BOT DELIVERY FAILED: ${error.message}`);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pUrl = PROXY_URL_HIDDEN; 
            const targetUrl = urlInput.value.trim();
            if (!targetUrl) return;

            terminal.innerHTML = '';
            addLog(`SYSTEM WAKE. TARGET: ${targetUrl}`);
            
            const origBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `PROCESSING...`;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');

            try {
                const fetchUrl = buildProxyUrl(pUrl, targetUrl);
                addLog(`FETCHING PAYLOAD VIA PROXY NODE...`);
                
                const response = await fetch(fetchUrl, { method: 'GET', headers: { 'Cache-Control': 'no-cache' } });
                if (!response.ok) throw new Error(`PROXY REJECTED CONNECTION: ${response.status}`);

                addLog(`PAYLOAD RECEIVED. PARSING DATA...`);
                const htmlText = await response.text();
                const cleanHtml = htmlText.replace(/\\u002F/g, '/').replace(/\\\//g, '/');
                
                let mediaUrl = null;
                let isVideo = false;

                const mp4Matches = cleanHtml.match(/https:\/\/[^"'\s>]+\.mp4[^"'\s>]*/g);
                
                if (mp4Matches && mp4Matches.length > 0) {
                    const uniqueMp4s = [...new Set(mp4Matches)];
                    let bestVideo = uniqueMp4s.find(url => url.includes('1080p')) || uniqueMp4s.find(url => url.includes('720p')) || uniqueMp4s.find(url => url.includes('480p')) || uniqueMp4s[0];
                    mediaUrl = bestVideo.split(/[\\]/)[0].split('?')[0];
                    isVideo = true;
                    addLog(`SUCCESS: VIDEO STREAM ISOLATED.`);
                } else {
                    addLog(`FALLING BACK TO IMAGE EXTRACTION...`);
                    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
                    const ogImage = doc.querySelector('meta[property="og:image"]');
                    if (ogImage) {
                        mediaUrl = ogImage.content.replace(/\/\d+x\//, '/originals/');
                        addLog(`SUCCESS: HIGH-RES IMAGE LOCATED.`);
                    } else {
                        const imgMatches = cleanHtml.match(/https:\/\/[^"'\s>]+\.(jpg|jpeg|png)/gi);
                        if (imgMatches && imgMatches.length > 0) {
                            let bestImg = [...new Set(imgMatches)].find(url => url.includes('/originals/')) || [...new Set(imgMatches)][0];
                            mediaUrl = bestImg.split(/[\\]/)[0].split('?')[0];
                            addLog(`SUCCESS: RAW IMAGE LOCATED.`);
                        }
                    }
                }

                if (!mediaUrl) throw new Error("NO MEDIA DETECTED IN PAYLOAD.");

                addLog(`TARGET MEDIA URL: ${mediaUrl}`);
                
                // Передаем ссылку на сервер бота вместо открытия вкладки
                await sendToTelegramBot(mediaUrl, isVideo);

            } catch (error) {
                addLog(`CRITICAL ERROR: ${error.message}`);
            } finally {
                submitBtn.innerHTML = origBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
